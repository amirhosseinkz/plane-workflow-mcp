[project]
name = "plane-workflow-mcp"
version = "0.2.0"
description = "Configurable Plane work-item workflow MCP server"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Plane Workflow Contributors" }]
license = "MIT"
license-files = ["LICENSE"]
keywords = ["mcp", "plane", "workflow"]
classifiers = [
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Topic :: Software Development",
]
dependencies = [
  "fastmcp>=3.2.0,<4",
  "keyring>=25.0,<26",
  "pypdf>=6.15.0",
  "python-docx>=1.2.0",
  "reportlab>=5.0.0",
  "requests>=2.31,<3",
]

[project.urls]
Homepage = "https://github.com/amirhosseinkz/plane-workflow-mcp"
Repository = "https://github.com/amirhosseinkz/plane-workflow-mcp"
Issues = "https://github.com/amirhosseinkz/plane-workflow-mcp/issues"

[project.scripts]
plane-workflow = "cli:main"

[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["cli", "configuration", "reports", "server"]

[tool.setuptools.packages.find]
include = ["plane_workflow_mcp"]

[tool.setuptools.package-data]
plane_workflow_mcp = ["profiles.json"]
