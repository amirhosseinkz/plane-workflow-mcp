[project]
name = "plane-workflow-mcp"
version = "0.6.1"
description = "Plane task workflows for coding agents: planning rules, previews, and completion records"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Plane Workflow Contributors" }]
license = "MIT"
license-files = ["LICENSE"]
keywords = ["mcp", "model-context-protocol", "plane", "plane-so", "project-management", "workflow", "claude-code", "codex", "ai-agents"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development",
]
dependencies = [
  "fastmcp>=3.2.0,<4",
  "keyring>=25.0,<26",
  "pydantic>=2.11,<3",
  "pypdf>=6.15.0",
  "python-docx>=1.2.0",
  "reportlab>=5.0.0",
  "requests>=2.31,<3",
  "tzdata>=2025.2; platform_system == 'Windows'",
]

[project.urls]
Homepage = "https://github.com/amirhosseinkz/plane-workflow-mcp"
Repository = "https://github.com/amirhosseinkz/plane-workflow-mcp"
Issues = "https://github.com/amirhosseinkz/plane-workflow-mcp/issues"
Changelog = "https://github.com/amirhosseinkz/plane-workflow-mcp/blob/main/CHANGELOG.md"
Documentation = "https://github.com/amirhosseinkz/plane-workflow-mcp/tree/main/docs"

[project.scripts]
plane-workflow = "plane_workflow_mcp.cli:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["plane_workflow_mcp"]

[tool.setuptools.package-data]
plane_workflow_mcp = ["profiles.json"]
