name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: Build, verify, and upload
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/plane-workflow-mcp/
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Build distributions
        run: uv build --project plugins/plane-workflow --out-dir dist

      - name: Verify clean installation and MCP discovery
        run: python scripts/smoke_distribution.py dist

      - name: Upload with trusted publishing
        run: uv publish --trusted-publishing always dist/*
